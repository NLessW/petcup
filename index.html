<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>페트컵 기능 테스트</title>
    </head>
    <body>
        <h1>페트컵 통합 제어 시스템</h1>

        <div>
            <h3>시리얼 포트 연결</h3>
            <div>
                <strong>📦 페트컵 제어 (COM8 RS-485):</strong>
                <button onclick="connectPetcup()" id="connectPetcupBtn">연결</button>
                <button onclick="disconnectPetcup()" id="disconnectPetcupBtn" disabled>해제</button>
                <span id="petcupStatus">연결 안 됨</span>
            </div>
            <div>
                <strong>📡 레이더 센서 (COM9):</strong>
                <button onclick="connectRadar()" id="connectRadarBtn">연결</button>
                <button onclick="disconnectRadar()" id="disconnectRadarBtn" disabled>해제</button>
                <span id="radarStatus">연결 안 됨</span>
            </div>
            <div>
                <strong>🤖 XL430 서보 (COM5):</strong>
                <button onclick="connectServo()" id="connectServoBtn">연결</button>
                <button onclick="disconnectServo()" id="disconnectServoBtn" disabled>해제</button>
                <span id="servoStatus">연결 안 됨</span>
            </div>
        </div>

        <div>
            <label>장치 ID: <input type="number" id="deviceId" value="1" min="1" max="255" /></label>
        </div>

        <div>
            <h3>문 제어</h3>
            <button onclick="sendCommand('OPEN')">문 열기 (OPEN)</button>
            <button onclick="sendCommand('CLOSE')">문 닫기 (CLOSE)</button>
            <button onclick="sendCommand('STOP')">정지 (STOP)</button>
            <button onclick="sendCommand('STATUS')">상태 확인 (STATUS)</button>
        </div>

        <div>
            <h3>속도 설정</h3>
            <label>열기 속도: <input type="number" id="speedOpen" value="200" min="0" max="255" /></label>
            <label>닫기 속도: <input type="number" id="speedClose" value="200" min="0" max="255" /></label>
            <button onclick="setSpeed()">속도 설정 (SETSPEED)</button>
        </div>

        <div>
            <h3>UV / 펌프 / 팬 제어</h3>
            <button onclick="sendCommand('UV:ON')">UV ON</button>
            <button onclick="sendCommand('UV:OFF')">UV OFF</button>
            <br />
            <button onclick="sendCommand('PUMP:ON')">펌프 ON</button>
            <button onclick="sendCommand('PUMP:OFF')">펌프 OFF</button>
            <br />
            <button onclick="sendCommand('FAN:ON')">팬 전체 ON</button>
            <button onclick="sendCommand('FAN:OFF')">팬 전체 OFF</button>
            <br />
            <button onclick="sendCommand('FAN1:ON')">팬1 ON</button>
            <button onclick="sendCommand('FAN1:OFF')">팬1 OFF</button>
            <button onclick="sendCommand('FAN2:ON')">팬2 ON</button>
            <button onclick="sendCommand('FAN2:OFF')">팬2 OFF</button>
        </div>

        <div>
            <h3>🎯 레이더 거리 센서</h3>
            <div
                id="radarData"
                style="
                    margin: 10px 0;
                    padding: 15px;
                    background: #e8f5e9;
                    border-radius: 8px;
                    text-align: center;
                    font-size: 24px;
                    font-weight: bold;
                    color: #2e7d32;
                "
            >
                거리: 대기중...
            </div>
            <button onclick="requestRadarData()">📡 거리 측정 요청</button>
        </div>

        <div>
            <h3>🤖 XL430 서보 모터 (Dynamixel ID:2)</h3>
            <div>
                <button onclick="enableServo()">토크 ON</button>
                <button onclick="disableServo()">토크 OFF</button>
            </div>
            <div style="margin-top: 10px">
                <button onclick="moveForward()" style="font-size: 16px; padding: 10px 20px">⬆️ 앞으로 (268.3°)</button>
                <button onclick="moveBackward()" style="font-size: 16px; padding: 10px 20px">⬇️ 뒤로 (323°)</button>
            </div>
            <div id="servoData" style="margin: 10px 0; padding: 10px; background: #e3f2fd; border-radius: 4px">
                서보: 대기중...
            </div>
        </div>

        <div>
            <h3>🤏 그리퍼 제어 (Dynamixel ID:1)</h3>
            <div>
                <button onclick="enableGripper()">토크 ON</button>
                <button onclick="disableGripper()">토크 OFF</button>
            </div>
            <div style="margin-top: 10px">
                <button
                    onclick="openGripper()"
                    style="font-size: 16px; padding: 10px 20px; background: #4caf50; color: white"
                >
                    ✋ 열기 (154°)
                </button>
                <button
                    onclick="closeGripper()"
                    style="font-size: 16px; padding: 10px 20px; background: #f44336; color: white"
                >
                    ✊ 닫기 (184°)
                </button>
            </div>
            <div id="gripperData" style="margin: 10px 0; padding: 10px; background: #fff3e0; border-radius: 4px">
                그리퍼: 대기중...
            </div>
        </div>

        <div>
            <h3>전송할 명령어</h3>
            <pre id="commandOutput"></pre>
        </div>

        <div>
            <h3>로그</h3>
            <textarea id="log" rows="10" cols="60" readonly></textarea>
            <button onclick="clearLog()">로그 지우기</button>
        </div>

        <script src="src/index.js"></script>
    </body>
</html>
